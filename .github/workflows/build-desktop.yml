name: Build Avalonia Desktop Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PCL.Avalonia.sln

      - name: Test
        run: dotnet test PCL.Avalonia.sln -c Release --no-restore

  build:
    name: Package ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-x86
          - os: windows-latest
            rid: win-arm64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve version
        shell: bash
        run: |
          describe="$(git describe --tags --always 2>/dev/null || echo ci)"
          echo "describe=${describe}" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        shell: bash
        run: |
          dotnet publish PCL.Avalonia/PCL.Avalonia.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -o publish \
            -p:DebugType=None \
            -p:DebugSymbols=false

      - name: Package Windows (NSIS)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          name="PCL2.Avalonia-${describe}-${{ matrix.rid }}"
          outfile="${name}-setup.exe"
          sed "s|@OUTFILE@|${outfile}|g" build-scripts/installer.nsi > build-scripts/installer-final.nsi
          makensis build-scripts/installer-final.nsi
          sha256sum "${name}-setup.exe" > "${name}-setup.exe.sha256"

      - name: Package macOS (DMG)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          name="PCL2.Avalonia-${describe}-${{ matrix.rid }}"
          app="$name.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp PCL.Avalonia/Assets/Info.plist "$app/Contents/Info.plist"
          cp -R publish/. "$app/Contents/MacOS/"

          # Generate .icns from PNG
          iconset="$name.iconset"
          mkdir -p "$iconset"
          sips -z 16 16 --out "$iconset/icon_16x16.png" PCL.Avalonia/Assets/pcl2-avalonia.png
          sips -z 32 32 --out "$iconset/icon_16x16@2x.png" PCL.Avalonia/Assets/pcl2-avalonia@2x.png
          sips -z 32 32 --out "$iconset/icon_32x32.png" PCL.Avalonia/Assets/pcl2-avalonia.png
          sips -z 64 64 --out "$iconset/icon_32x32@2x.png" PCL.Avalonia/Assets/pcl2-avalonia@2x.png
          sips -z 128 128 --out "$iconset/icon_128x128.png" PCL.Avalonia/Assets/pcl2-avalonia@2x.png
          sips -z 256 256 --out "$iconset/icon_256x256.png" PCL.Avalonia/Assets/pcl2-avalonia@2x.png
          sips -z 512 512 --out "$iconset/icon_512x512.png" PCL.Avalonia/Assets/pcl2-avalonia@2x.png
          sips -z 1024 1024 --out "$iconset/icon_512x512@2x.png" PCL.Avalonia/Assets/pcl2-avalonia@2x.png
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/PCL2Avalonia.icns"
          rm -rf "$iconset"

          # Ad-hoc sign the .app bundle
          codesign --sign - --force --deep --timestamp=none "$app"
          # Create DMG
          dmg_name="${name}.dmg"
          hdiutil create -volname "PCL2 Avalonia" -srcfolder "$app" -ov -format UDZO "$dmg_name"
          shasum -a 256 "$dmg_name" > "${dmg_name}.sha256"

      - name: Package Linux (AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          name="PCL2.Avalonia-${describe}-${{ matrix.rid }}"
          # Download appimagetool if not cached
          if [ ! -f /tmp/appimagetool ]; then
            curl -L -o /tmp/appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${{ matrix.rid == 'linux-x64' && 'x86_64' || 'aarch64' }}.AppImage"
            chmod +x /tmp/appimagetool
          fi
          # Create AppDir structure
          mkdir -p "AppDir/usr/bin" "AppDir/usr/lib" "AppDir/usr/share/applications" "AppDir/usr/share/icons/hicolor/256x256/apps"
          cp -r publish/. "AppDir/usr/lib/"
          cat > "AppDir/usr/bin/pcl2-avalonia" << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/../lib/PCL2.Avalonia" "$@"
          EOF
          chmod +x "AppDir/usr/bin/pcl2-avalonia"
          cat > "AppDir/usr/share/applications/pcl2-avalonia.desktop" << 'EOF'
          [Desktop Entry]
          Name=PCL2 Avalonia
          Exec=pcl2-avalonia
          Icon=pcl2-avalonia
          Type=Application
          Categories=Game;
          EOF
          cp PCL.Avalonia/Assets/pcl2-avalonia.png "AppDir/usr/share/icons/hicolor/256x256/apps/pcl2-avalonia.png"
          /tmp/appimagetool AppDir "${name}.AppImage"
          sha256sum "${name}.AppImage" > "${name}.AppImage.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PCL2.Avalonia-${{ env.describe }}-${{ matrix.rid }}
          path: PCL2.Avalonia-${{ env.describe }}-${{ matrix.rid }}.*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach assets to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --generate-notes --title "$tag"
          fi
          gh release upload "$tag" release-assets/*.zip release-assets/*.tar.gz release-assets/*.dmg release-assets/*.AppImage release-assets/*.exe release-assets/*.sha256 --clobber
