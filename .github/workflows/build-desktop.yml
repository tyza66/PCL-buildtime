name: Build Avalonia Desktop Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PCL.Avalonia.sln

      - name: Test
        run: dotnet test PCL.Avalonia.sln -c Release --no-restore

  build:
    name: Package ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            suffix: -setup.exe
          - os: windows-latest
            rid: win-x86
            suffix: -setup.exe
          - os: windows-latest
            rid: win-arm64
            suffix: -setup.exe
          - os: macos-latest
            rid: osx-x64
            suffix: .dmg
          - os: macos-latest
            rid: osx-arm64
            suffix: .dmg
          - os: ubuntu-latest
            rid: linux-x64
            suffix: .AppImage
          - os: ubuntu-latest
            rid: linux-arm64
            suffix: .AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' PCL.Avalonia/PCL.Avalonia.csproj)"
          fi
          if [ -z "$version" ]; then
            echo "::error::Unable to resolve package version"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        shell: bash
        run: |
          dotnet publish PCL.Avalonia/PCL.Avalonia.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -o publish \
            -p:DebugType=None \
            -p:DebugSymbols=false

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Package Windows (NSIS)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          name="PCL2.Avalonia-${version}-${{ matrix.rid }}"
          outfile="${name}${{ matrix.suffix }}"
          sed "s|@OUTFILE@|${outfile}|g" build-scripts/installer.nsi > build-scripts/installer-final.nsi
          makensis build-scripts/installer-final.nsi
          sha256sum "${outfile}" > "${outfile}.sha256"

      - name: Package macOS (DMG)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          name="PCL2.Avalonia-${version}-${{ matrix.rid }}"
          dmg_name="${name}${{ matrix.suffix }}"
          app="$name.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp PCL.Avalonia/Assets/Info.plist "$app/Contents/Info.plist"
          cp -R publish/. "$app/Contents/MacOS/"

          # Generate .icns from the PCL icon
          iconset="$name.iconset"
          src_base="PCL.Avalonia/Assets/pcl2-avalonia.png"
          src_hi="PCL.Avalonia/Assets/pcl2-avalonia@2x.png"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            for scale in 1 2; do
              px=$((size * scale))
              if [ "$px" -le 256 ]; then src="$src_base"; else src="$src_hi"; fi
              sips -z "$px" "$px" --out "$iconset/icon_${size}x${size}@${scale}x.png" "$src"
            done
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/PCL2Avalonia.icns"
          rm -rf "$iconset"

          # Ad-hoc sign the .app bundle
          codesign --sign - --force --deep --timestamp=none "$app"
          # Stage the DMG volume with the /Applications drag-to-install alias
          stage="dmg-stage"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -R "$app" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "PCL2 Avalonia" -srcfolder "$stage" -ov -format UDZO "$dmg_name"
          rm -rf "$stage"
          shasum -a 256 "$dmg_name" > "${dmg_name}.sha256"
          # Verify the DMG contents: /Applications alias and the icon resource
          mount_dir="$PWD/dmg-mount"
          rm -rf "$mount_dir"
          mkdir -p "$mount_dir"
          hdiutil attach "$dmg_name" -mountpoint "$mount_dir" -nobrowse > /dev/null
          ls -l "$mount_dir"
          if [ ! -L "$mount_dir/Applications" ]; then
            echo "::error::DMG is missing the /Applications alias"
            exit 1
          fi
          if [ ! -f "$mount_dir/$app/Contents/Resources/PCL2Avalonia.icns" ]; then
            echo "::error::App bundle is missing PCL2Avalonia.icns"
            exit 1
          fi
          hdiutil detach "$mount_dir" > /dev/null
          rm -rf "$mount_dir"

      - name: Package Linux (AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          name="PCL2.Avalonia-${version}-${{ matrix.rid }}"
          package="${name}${{ matrix.suffix }}"
          # Download x86_64 appimagetool (runs on the x64 runner regardless of target arch)
          if [ "${{ matrix.rid }}" = "linux-arm64" ]; then
            export ARCH=arm64
          else
            export ARCH=x86_64
          fi
          if [ ! -f /tmp/appimagetool ]; then
            curl -L -o /tmp/appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
            chmod +x /tmp/appimagetool
          fi
          # Create AppDir structure
          mkdir -p "AppDir/usr/bin" "AppDir/usr/lib" "AppDir/usr/share/icons/hicolor/256x256/apps"
          cp -r publish/. "AppDir/usr/lib/"
          cat > "AppDir/usr/bin/pcl2-avalonia" << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/../lib/PCL2.Avalonia" "$@"
          EOF
          chmod +x "AppDir/usr/bin/pcl2-avalonia"
          # Desktop file MUST be at AppDir root for appimagetool to detect it
          cat > "AppDir/pcl2-avalonia.desktop" << 'EOF'
          [Desktop Entry]
          Name=PCL2 Avalonia
          Exec=pcl2-avalonia
          Icon=pcl2-avalonia
          Type=Application
          Categories=Game;
          EOF
          # Also place in usr/share for the AppImage runtime
          mkdir -p "AppDir/usr/share/applications"
          cp "AppDir/pcl2-avalonia.desktop" "AppDir/usr/share/applications/pcl2-avalonia.desktop"
          # Icon: must exist at AppDir root with same base name as desktop file
          cp PCL.Avalonia/Assets/pcl2-avalonia.png "AppDir/pcl2-avalonia.png"
          cp PCL.Avalonia/Assets/pcl2-avalonia.png "AppDir/usr/share/icons/hicolor/256x256/apps/pcl2-avalonia.png"
          /tmp/appimagetool --appimage-extract-and-run AppDir "${package}"
          sha256sum "${package}" > "${package}.sha256"

      - name: Verify package
        shell: bash
        run: |
          base="PCL2.Avalonia-${version}-${{ matrix.rid }}"
          for f in "$base${{ matrix.suffix }}" "$base${{ matrix.suffix }}.sha256"; do
            if [ ! -s "$f" ]; then
              echo "::error::Expected package is missing: $f"
              exit 1
            fi
          done
          ls -l "$base"*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PCL2.Avalonia-${{ env.version }}-${{ matrix.rid }}
          path: |
            PCL2.Avalonia-${{ env.version }}-${{ matrix.rid }}${{ matrix.suffix }}
            PCL2.Avalonia-${{ env.version }}-${{ matrix.rid }}${{ matrix.suffix }}.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach assets to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          repo="${{ github.repository }}"
          if ! gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            gh release create "$tag" -R "$repo" --generate-notes --title "$tag"
          fi
          gh release upload "$tag" -R "$repo" release-assets/* --clobber
