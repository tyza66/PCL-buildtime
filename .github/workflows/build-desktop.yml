name: Build Avalonia Desktop Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PCL.Avalonia.sln

      - name: Test
        run: dotnet test PCL.Avalonia.sln -c Release --no-restore

  build:
    name: Package ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-x86
          - os: windows-latest
            rid: win-arm64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve version
        shell: bash
        run: |
          describe="$(git describe --tags --always 2>/dev/null || echo ci)"
          echo "describe=${describe}" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        shell: bash
        run: |
          dotnet publish PCL.Avalonia/PCL.Avalonia.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -o publish \
            -p:DebugType=None \
            -p:DebugSymbols=false

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "PCL2.Avalonia-$env:describe-${{ matrix.rid }}"
          Compress-Archive -Path "publish/*" -DestinationPath "$name.zip" -Force
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash
          "$hash  $name.zip" | Set-Content "$name.zip.sha256" -Encoding ascii

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          name="PCL2.Avalonia-${describe}-${{ matrix.rid }}"
          app="$name.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp PCL.Avalonia/Assets/Info.plist "$app/Contents/Info.plist"
          cp -R publish/. "$app/Contents/MacOS/"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$name.zip"
          shasum -a 256 "$name.zip" > "$name.zip.sha256"

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          name="PCL2.Avalonia-${describe}-${{ matrix.rid }}"
          tar -czf "$name.tar.gz" -C publish .
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PCL2.Avalonia-${{ env.describe }}-${{ matrix.rid }}
          path: PCL2.Avalonia-${{ env.describe }}-${{ matrix.rid }}.*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach assets to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --generate-notes --title "$tag"
          fi
          gh release upload "$tag" release-assets/*.zip release-assets/*.tar.gz release-assets/*.sha256 --clobber
