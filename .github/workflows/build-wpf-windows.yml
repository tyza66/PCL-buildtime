name: Build WPF Windows Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve version
        shell: bash
        run: |
          describe="$(git describe --tags --always 2>/dev/null || echo ci)"
          echo "describe=${describe}" >> "$GITHUB_ENV"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Update bundled help
        shell: pwsh
        run: |
          $helpDir = Join-Path $env:RUNNER_TEMP "PCL2Help"
          git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1 $helpDir
          Remove-Item -LiteralPath (Join-Path $helpDir ".git") -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $helpDir "*") -DestinationPath "Plain Craft Launcher 2\Resources\Help.zip" -Force

      - name: Replace build metadata
        shell: pwsh
        run: |
          (Get-Content "Plain Craft Launcher 2\Modules\ModSecret.vb") -replace 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "")', 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "${{ secrets.CLIENT_ID }}")' | Set-Content "Plain Craft Launcher 2\Modules\ModSecret.vb" -Encoding utf8
          (Get-Content "Plain Craft Launcher 2\Modules\ModSecret.vb") -replace 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "")', 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "${{ secrets.CURSEFORGE_API_KEY }}")' | Set-Content "Plain Craft Launcher 2\Modules\ModSecret.vb" -Encoding utf8
          (Get-Content "Plain Craft Launcher 2\Modules\Base\ModBase.vb") -replace 'Public Const CommitHash As String = ""', 'Public Const CommitHash As String = "${{ github.sha }}"' | Set-Content "Plain Craft Launcher 2\Modules\Base\ModBase.vb" -Encoding utf8

      - name: Restore NuGet packages
        run: dotnet restore PCLCS\PCLCS.csproj

      - name: Build
        run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=Release -p:PlatformTarget=${{ matrix.arch }}

      - name: Stage executable
        shell: pwsh
        run: |
          $exe = @(
            Get-ChildItem -Path "Plain Craft Launcher 2\bin" -Recurse -Filter "Plain Craft Launcher 2.exe" -ErrorAction SilentlyContinue
            Get-ChildItem -Path "Plain Craft Launcher 2\obj\Release" -Recurse -Filter "Plain Craft Launcher 2.exe" -ErrorAction SilentlyContinue
          ) | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            throw "Plain Craft Launcher 2.exe was not found in the build output."
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath $exe -Destination "dist\Plain Craft Launcher 2.exe" -Force

      - name: Package
        shell: pwsh
        run: |
          $zipName = "PCL2-$env:describe-win-${{ matrix.arch }}.zip"
          Compress-Archive -Path "dist\*" -DestinationPath $zipName -Force
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash
          "$hash  $zipName" | Set-Content "$zipName.sha256" -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PCL2-${{ env.describe }}-win-${{ matrix.arch }}
          path: |
            PCL2-${{ env.describe }}-win-${{ matrix.arch }}.zip
            PCL2-${{ env.describe }}-win-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach assets to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --generate-notes --title "$tag"
          fi
          gh release upload "$tag" release-assets/*.zip release-assets/*.sha256 --clobber
